    <div class="gba-bar">
      <span data-focus>Small mailbox</span>
      <div data-pager>
        <button data-input="prev" aria-label="Previous story page">←</button>
        <span data-page aria-live="polite"></span>
        <button data-input="next" aria-label="Next story page">→</button>
      </div>
    </div>
    <div class="gba-copy" data-copy aria-live="polite"></div>
    <div class="gba-footer" data-room-controls>
      <button data-input="paths"><kbd>↑</kbd> Paths</button>
      <button data-input="act"><kbd>A</kbd> Act</button>
      <button data-input="back"><kbd>B</kbd> Look</button>
      <button data-input="focus"><kbd>L/R</kbd> Focus</button>
      <button data-input="bag"><kbd>SEL</kbd> Bag</button>
    </div>
    <div class="gba-footer" data-menu-controls hidden>
      <button data-input="back"><kbd>B</kbd> Back</button>
    </div>
  </section>
</div>
<style>
  #gba-story-paging { padding: 16px 0; }
  #gba-story-paging [hidden] { display: none; }
  #gba-story-paging .gba-screen {
    width: min(100%, 480px); margin: auto; container-type: inline-size;
    background: #161e19; color: #fae9c9; font-family: ui-monospace, monospace;
  }
  #gba-story-paging .gba-scene { aspect-ratio: 240 / 91; overflow: hidden; }
  #gba-story-paging img { width: 100%; display: block; image-rendering: pixelated; }
  #gba-story-paging .gba-bar, #gba-story-paging .gba-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 3cqw; border-block-start: 1px solid #66684d; font-size: 3cqw;
  }
  #gba-story-paging .gba-bar { color: #f9c36d; min-height: 7cqw; }
  #gba-story-paging .gba-copy {
    background: #222d27; min-height: 17cqw; padding: 1.2cqw 3cqw;
    font-size: 3.25cqw; line-height: 1.25; white-space: pre-line;
  }
  #gba-story-paging .gba-footer { min-height: 7cqw; gap: 0.5cqw; }
  #gba-story-paging button {
    background: transparent; border: 0; color: inherit; font: inherit; padding: 0.9cqw 0.45cqw;
  }
  #gba-story-paging button:hover:not(:disabled) { background: #384438; }
  #gba-story-paging button:disabled { opacity: .42; }
  #gba-story-paging kbd { border: 1px solid #66684d; color: #f9c36d; padding: 0 0.5cqw; }
  #gba-story-paging .gba-copy button { display: block; text-align: left; }
</style>
<script>
(() => {
  const root = document.getElementById('gba-story-paging');
  const get = (role) => root.querySelector('[data-' + role + ']');
  const intro = [
    'You are standing in an open field\nwest of a white house. The front\ndoor is boarded shut.',
    'A small mailbox stands nearby.\nA path leads around the house.'
  ];
  let pages = intro, page = 0, menu = '', mailbox = true, opened = false;
  function render() {
    get('focus').textContent = menu || (mailbox ? 'Small mailbox' : 'Room actions');
    get('pager').hidden = Boolean(menu) || pages.length < 2;
    get('page').textContent = (page + 1) + '/' + pages.length;
    root.querySelector('[data-input="prev"]').disabled = page === 0;
    root.querySelector('[data-input="next"]').disabled = page + 1 === pages.length;
    get('room-controls').hidden = Boolean(menu);
    get('menu-controls').hidden = !menu;
    get('copy').textContent = menu ? '' : pages[page];
    if (menu === 'Carried items') get('copy').textContent = 'Nothing carried.';
    const rows = menu === 'Small mailbox' ? (opened ? ['Examine'] : ['Examine', 'Open'])
      : menu === 'Room actions' ? ['Look around', 'Paths']
      : menu === 'Paths' ? ['North', 'South'] : [];
    for (const row of rows) {
      const button = document.createElement('button');
      button.textContent = '› ' + row;
      button.dataset.input = row;
      get('copy').append(button);
    }
  }
  function response(lines) { pages = lines; page = 0; menu = ''; }
  function input(key) {
    switch (key) {
      case 'prev': if (!menu) page = Math.max(0, page - 1); break;
      case 'next': if (!menu) page = Math.min(pages.length - 1, page + 1); break;
      case 'focus': if (!menu) mailbox = !mailbox; break;
      case 'act': if (!menu) menu = mailbox ? 'Small mailbox' : 'Room actions'; break;
      case 'paths': case 'Paths': menu = 'Paths'; break;
      case 'bag': if (!menu) menu = 'Carried items'; break;
      case 'back': if (menu) menu = ''; else response(intro); break;
      case 'Look around': response(intro); break;
      case 'Examine': response([opened ? 'The small mailbox is open.' : 'The small mailbox is closed.']); break;
      case 'Open': opened = true; response(['You open the mailbox.\nInside is a leaflet.']); break;
      case 'North': case 'South': response(['You look ' + key.toLowerCase() + ' along the path.']); break;
    }
    render();
  }
  root.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-input]');
    if (button) input(button.dataset.input);
  });
  root.addEventListener('keydown', (event) => {
    const keys = { ArrowLeft: 'prev', ArrowRight: 'next', ArrowUp: 'paths', a: 'act', b: 'back' };
    const key = keys[event.key];
    if (key && !menu) { event.preventDefault(); input(key); }
    else if (menu && (event.key === 'Escape' || event.key === 'b')) {
      event.preventDefault(); input('back');
    }
  });
  render();
})();
</script>
