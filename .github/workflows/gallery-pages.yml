name: Publish mGBA gallery

on:
  push:
    branches: [main]
    paths:
      - 'qa/mgba-room-gallery/**'
      - '.github/workflows/gallery-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Stage gallery and check local links
        run: python3 qa/mgba-room-gallery/stage_pages.py _site
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
