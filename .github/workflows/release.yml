name: Build and release ROMs

# Every merge to main builds and tests both cartridges, then publishes them as a
# GitHub Release. The README links to releases/latest/download/<rom>.gba, which
# always resolves to the newest release's assets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Same toolchain image as the Dockerfile's documented local build.
    container: devkitpro/devkitarm:20260610
    env:
      CROSS: /opt/devkitpro/devkitARM/bin/arm-none-eabi-
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pil gcc libc6-dev

      - name: Test
        run: make test

      - name: Build ROMs
        run: make all

      - uses: actions/upload-artifact@v4
        with:
          name: roms
          path: |
            zork-trilogy.gba
            zork-white-house.gba
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roms

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          sha256sum zork-trilogy.gba zork-white-house.gba > SHA256SUMS.txt
          gh release create "$tag" zork-trilogy.gba zork-white-house.gba SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Zork Trilogy build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7} on main. Download zork-trilogy.gba for all three chapters, or zork-white-house.gba for the seven-room demo." \
            --latest
